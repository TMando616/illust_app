# XcodeGen の設定。.xcodeproj はここから生成する（`xcodegen generate`）。
# .xcodeproj は git に入れず、このファイルを正とする
name: IllustApp
options:
  bundleIdPrefix: com.tmando616
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  IllustrationKit:
    path: IllustrationKit
targets:
  IllustApp:
    type: application
    platform: iOS
    sources: [IllustApp]
    dependencies:
      - package: IllustrationKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tmando616.illust
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: イラスト変換   # 仮称
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # PhotosPicker は読み取りの許可が要らない。保存に使う追加のみの許可だけ書く
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 変換した画像を写真アプリに保存します
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
